<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{tasks/layout :: layout(~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Задачи</h1>
        <a href="/tasks/create" class="btn btn-primary">Добавить задание</a>
    </div>
    
    <div class="mb-3">
        <a href="/tasks" class="btn btn-sm" 
           th:classappend="${filter == 'all'} ? 'btn-secondary' : 'btn-outline-secondary'">Все</a>
        <a href="/tasks?done=true" class="btn btn-sm"
           th:classappend="${filter == 'done'} ? 'btn-secondary' : 'btn-outline-secondary'">Выполненные</a>
        <a href="/tasks?done=false" class="btn btn-sm"
           th:classappend="${filter == 'new'} ? 'btn-secondary' : 'btn-outline-secondary'">Новые</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Описание</th>
                <th>Дата создания</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}">1</td>
                <td>
                    <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.description}">Description</a>
                </td>
                <td th:text="${#temporals.format(task.created, 'dd.MM.yyyy HH:mm')}">01.01.2024</td>
                <td>
                    <span th:if="${task.done}" class="badge bg-success">Выполнено</span>
                    <span th:unless="${task.done}" class="badge bg-primary">Новое</span>
                </td>
            </tr>
            <tr th:if="${tasks.empty}">
                <td colspan="4" class="text-center">Задач нет</td>
            </tr>
        </tbody>
    </table>
</th:block>
</html>
