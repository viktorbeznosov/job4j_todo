<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/tasks">TODO List</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" th:text="${user.name}">User</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Выход</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Задачи</h1>
        <a href="/tasks/create" class="btn btn-primary">Добавить задание</a>
    </div>
    
    <div class="mb-3">
        <a href="/tasks" class="btn btn-sm" 
           th:classappend="${filter.done == null} ? 'btn-secondary' : 'btn-outline-secondary'">Все</a>
        <a href="/tasks?done=true" class="btn btn-sm"
           th:classappend="${filter.done == true} ? 'btn-secondary' : 'btn-outline-secondary'">Выполненные</a>
        <a href="/tasks?done=false" class="btn btn-sm"
           th:classappend="${filter.done == false} ? 'btn-secondary' : 'btn-outline-secondary'">Новые</a>
    </div>

    <p class="text-danger" th:text="${message}"></p>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th>Дата создания</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}">1</td>
                <td>
                    <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}">Title</a>
                </td>
                <td>
                    <span th:text="${task.description}">Description</span>
                </td>
                <td th:text="${#temporals.format(task.created, 'dd.MM.yyyy HH:mm')}">01.01.2024</td>
                <td>
                    <span th:if="${task.done}" class="badge bg-success">Выполнено</span>
                    <span th:unless="${task.done}" class="badge bg-primary">Новое</span>
                </td>
            </tr>
            <tr th:if="${tasks.empty}">
                <td colspan="4" class="text-center">Задач нет</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
