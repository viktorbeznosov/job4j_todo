<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/tasks">TODO List</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" th:text="${user.name}">User</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Выход</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Задача #[[${task.id}]]</h5>
            <span th:if="${task.done}" class="badge bg-success">Выполнено</span>
            <span th:unless="${task.done}" class="badge bg-primary">Новое</span>
        </div>
        <div class="card-body">
            <h5 class="card-title" th:text="${task.title}">Title</h5>
            <p class="card-title" th:text="${task.description}">Description</p>
            <p class="card-text">
                <small class="text-muted">
                    Создана: [[${#temporals.format(task.created, 'dd.MM.yyyy HH:mm')}]]
                </small>
            </p>
        </div>
        <div class="card-footer">
            <form th:action="@{/tasks/{id}/done(id=${task.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-success" th:if="${!task.done}">Выполнено</button>
            </form>
            <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-primary">Редактировать</a>
            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger">Удалить</button>
            </form>
            <a href="/tasks" class="btn btn-secondary">Назад</a>
        </div>
    </div>
</div>
</body>
</html>
